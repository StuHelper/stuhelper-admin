name: Admin checks
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    uses: StuHelper/stuhelper-tooling/.github/workflows/frontend-changes.yml@v0.1.10
  check:
    uses: StuHelper/stuhelper-tooling/.github/workflows/node-checks.yml@v0.1.10
    with:
      name: Admin checks
      setup-command: pnpm run setup
  storage-browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    name: Storage browser checks
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: StuHelper/stuhelper-tooling/actions/setup@v0.1.10
      - uses: StuHelper/stuhelper-tooling/actions/frontend-cache@v0.1.10
      - run: make setup
      - name: Record source combination
        run: |
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          cat contracts/platform.source.json >> "$GITHUB_STEP_SUMMARY"
          cat contracts/storage.source.json >> "$GITHUB_STEP_SUMMARY"
          cat contracts/contribution.source.json >> "$GITHUB_STEP_SUMMARY"
      - run: make build
      - uses: StuHelper/stuhelper-tooling/actions/chromium@v0.1.10
      - run: make browser
